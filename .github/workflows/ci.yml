name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / Typecheck / Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build core
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Docs relative links
        run: npm run check:docs-links

      - name: Release manifest consistency
        run: npm run check:release

      - name: Skills inventory
        run: npm run check:skills

  core:
    name: Core Smoke & Golden (Windows)
    # golden 基线在 Windows 上录制，含路径分隔符、运行时探测与 WSL 状态，
    # 换到 Linux runner 会误报差异。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build core
        run: npm run build

      - name: CLI smoke tests
        run: npm run test:core

      - name: Golden baseline check
        run: npm run golden:check --workspace clawhermes-core

  replica:
    name: Replica Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run replica suite
        run: npm run test:replica

      - name: Test summary
        if: always()
        run: |
          echo "### Replica test result (Node ${{ matrix.node }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "测试套件对应 docs/reconstruction/OBLIGATIONS.md 中的 78 条复刻义务。" >> "$GITHUB_STEP_SUMMARY"

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Audit high and critical advisories
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
