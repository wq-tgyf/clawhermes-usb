name: ClawHermes Tests

on:
  push:
    branches: [main]
    paths:
      - "replica/**"
      - "core/**"
      - ".github/workflows/replica-tests.yml"
  pull_request:
    paths:
      - "replica/**"
      - "core/**"
      - ".github/workflows/replica-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    defaults:
      run:
        working-directory: replica

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Show environment
        run: |
          node --version
          npm --version

      - name: Run test suite
        run: npm test

      - name: Test summary
        if: always()
        run: |
          echo "### Replica test result (Node ${{ matrix.node }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "测试套件对应 docs/reconstruction/OBLIGATIONS.md 中的 78 条复刻义务。" >> $GITHUB_STEP_SUMMARY
          echo "详见 docs/reconstruction/COVERAGE.md 与 docs/reconstruction/E2E-VERIFICATION.md。" >> $GITHUB_STEP_SUMMARY

  core-smoke:
    name: Core Smoke & Golden
    # 必须在 Windows 上跑：golden 基线是在 Windows 上录制的，
    # 输出中含平台特有的路径分隔符、运行时探测结果与 WSL 状态，
    # 换到 Linux runner 会 100% 误报差异（实测 0 一致 / 19 差异）。
    runs-on: windows-latest
    defaults:
      run:
        working-directory: core/node

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: CLI smoke tests
        run: npm test

      - name: Golden baseline check
        run: npm run golden:check
